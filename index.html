<!DOCTYPE html>

<html lang="en">
<head>
	<meta charset="UTF-8">

	<title>DAILY NEWS DOZE</title>
	<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
	<meta content="#354c82" name="theme-color">
	<link href="manifest.json" rel="manifest">
	<meta content="yes" name="apple-mobile-web-app-capable">
	<meta content="black" name="apple-mobile-web-app-status-bar-style">
	<style>
	       body {
	           font-family: 'Segoe UI', sans-serif;
	           background: url('https://img.freepik.com/free-photo/overhead-shot-open-bible-notepad-with-pen-white-surface_181624-7038.jpg?uid=R176723555&ga=GA1.1.513903694.1737823088&semt=ais_hybrid&w=740') no-repeat center center fixed;
	           background-size: cover;
	           margin: 0;
	           padding: 0;
	       }

	       header {
	           position: sticky;
	           top: 0;
	           z-index: 1100;
	           background-color: rgba(53, 76, 130, 0.9);
	           color: #070a0b;
	           text-align: center;
	           padding: 20px;
	           font-size: 2rem;
	           letter-spacing: 1px;
	           backdrop-filter: blur(5px);
	           box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
	       }

	       #search-bar {
	         position: sticky; /* Keeps it in place while scrolling */
	        top: 80px; /* Ensures it stays below the header (adjust this value based on header height) */
	        z-index: 1000; /* Ensures it appears above other elements but below the header */
	        background: rgba(255, 255, 255, 0.9); /* Add a background to ensure visibility */
	        padding: 10px 0;
	        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); /* Optional shadow for better separation */
	        display: flex; /* Align input and button horizontally */
	        justify-content: center; /* Center the search bar */
	        gap: 0; /* Remove space between input and button */
	       }

	       #search-bar input {
	         width: 70%;
	        max-width: 400px;
	        padding: 8px 10px;
	        font-size: 0.9rem;
	        border: 2px solid #cbd5e1;
	        border-radius: 8px 0 0 8px;
	        outline: none;
	        flex-shrink: 0;
	       }

	       #search-bar button {
	         padding: 8px 16px;
	        font-size: 0.9rem;
	        border: none;
	        background-color: #2563eb;
	        color: #fff;
	        cursor: pointer;
	        border-radius: 0 8px 8px 0;
	        flex-shrink: 0;
	       }

	       #search-bar button:hover {
	           background-color: #2fcb23;
	       }

	       #trending-topics {
	           max-width: 800px;
	           margin: 10px auto;
	           text-align: center;
	           color: #1107dd;
	           font-size: 1rem;
	           padding: 10px;
	           overflow-x: auto;
	           white-space: nowrap;
	           -webkit-overflow-scrolling: touch;
	       }

	       #trending-topics a {
	           margin: 0 10px;
	           color: #0e1217;
	           text-decoration: none;
	           cursor: pointer;
	           transition: color 0.3s ease;
	       }

	       #trending-topics a:hover {
	           color: #2563eb;
	           text-decoration: underline;
	       }

	       #news-container {
	           max-width: 1200px;
	           margin: 20px auto;
	           display: grid;
	           grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
	           gap: 20px;
	           padding: 10px;
	       }

	       .news-card {
	           background: #ffffff;
	           border-radius: 15px;
	           overflow: hidden;
	           box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
	           display: flex;
	           flex-direction: column;
	           transition: transform 0.3s ease;
	       }

	       .news-card:hover {
	           transform: translateY(-5px);
	       }

	       .news-image {
	           width: 100%;
	           height: 180px;
	           object-fit: cover;
	           background-color: #cbd5e1;
	       }

	       .news-content {
	           padding: 15px;
	           display: flex;
	           flex-direction: column;
	           flex-grow: 1;
	       }

	       .news-content h3 {
	           margin: 0 0 10px;
	           font-size: 1.1rem;
	           color: #0f172a;
	       }

	       .news-content p {
	           flex-grow: 1;
	           font-size: 0.95rem;
	           color: #334155;
	       }

	       .action-buttons {
	           display: flex;
	           gap: 10px;
	           align-items: center;
	           margin-top: 10px;
	       }

	       .share-btn, .save-btn {
	           background: none;
	           border: none;
	           padding: 5px;
	           cursor: pointer;
	           color: #2563eb;
	           display: flex;
	           align-items: center;
	           justify-content: center;
	           border-radius: 50%;
	           transition: background-color 0.3s;
	       }

	       .share-btn:hover, .save-btn:hover {
	           background-color: rgba(37, 99, 235, 0.1);
	       }

	       .read-more {
	           padding: 8px 15px;
	           background-color: #2563eb;
	           color: white;
	           border-radius: 20px;
	           text-decoration: none;
	           font-size: 0.9rem;
	           transition: background-color 0.3s;
	       }

	       .read-more:hover {
	           background-color: #1d4ed8;
	       }

	       .news-footer {
	           font-size: 0.8rem;
	           color: #64748b;
	           margin-top: 10px;
	       }

	       @keyframes pulse {
	           0% { opacity: 0.6; }
	           50% { opacity: 1; }
	           100% { opacity: 0.6; }
	       }

	       .loading {
	           animation: pulse 1.5s infinite;
	       }

	       @media (max-width: 600px) {
	           header {
	               font-size: 1.5rem;
	               padding: 15px;
	           }

	           #search-bar {
	               top: 60px;
	               padding: 5px;
	           }

	           #search-bar input {
	               width: calc(100% - 100px);
	               font-size: 0.9rem;
	           }

	           #search-bar button {
	               width: 80px;
	               font-size: 0.9rem;
	           }

	           .news-card {
	               margin: 10px 0;
	               border-radius: 10px;
	           }

	           .news-image {
	               height: 150px;
	           }

	           .news-content h3 {
	               font-size: 1rem;
	           }

	           .news-content p {
	               font-size: 0.9rem;
	           }
	       }
	</style>
</head>

<body>
  <button id="install-btn" style="display: none; padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px;">
    📲 Install App
  </button>
  
	<header>
		📰 DAILY NEWS DOZE
	</header>


	<div id="search-bar">
		<input id="search-input" placeholder="Search for news (e.g., AI, business, sports)" type="text"> <button id="search-button">Search</button>
	</div>


	<div id="trending-topics">
		Trending: <a class="trend-link" data-topic="AI">AI</a> | <a class="trend-link" data-topic="India">India</a> | <a class="trend-link" data-topic="Entertainment in India">Entertainment</a> | <a class="trend-link" data-topic="Sports in India">Sports</a> | <a class="trend-link" data-topic="Music in India">Music</a> | <a class="trend-link" data-topic="Nepal">Nepal</a>
	</div>


	<div id="news-container">
		Loading latest news...
	</div>
	<script>
	       const apiKey = "54e184b238cd4ccbbca51bef62a043fc";
	       const baseUrl = "https://gnews.io/api/v4";

	       // Initialize touch handling for pull-to-refresh
	       let touchStartY = 0;
	       let touchEndY = 0;

	       document.addEventListener('touchstart', e => {
	           touchStartY = e.touches[0].clientY;
	       });

	       document.addEventListener('touchend', e => {
	           touchEndY = e.changedTouches[0].clientY;
	           if (touchEndY - touchStartY > 100 && window.scrollY === 0) {
	               fetchNews();
	           }
	       });

	       // Service Worker Registration
	       if ('serviceWorker' in navigator) {
	           navigator.serviceWorker.register('service-worker.js')
	               .then(registration => {
	                   console.log('ServiceWorker registration successful');
	               })
	               .catch(err => {
	                   console.log('ServiceWorker registration failed: ', err);
	               });
	       }

	       // Offline Storage Functions
	       function saveArticleOffline(article) {
	           if ('caches' in window) {
	               const offlineArticles = JSON.parse(localStorage.getItem('offlineArticles') || '[]');
	               offlineArticles.push(article);
	               localStorage.setItem('offlineArticles', JSON.stringify(offlineArticles));
	               alert('Article saved for offline reading!');
	           }
	       }

	       // Share Function
	       function shareArticle(article) {
	           if (navigator.share) {
	               navigator.share({
	                   title: article.title,
	                   text: article.description,
	                   url: article.url
	               }).catch(err => {
	                   console.log('Error sharing:', err);
	               });
	           } else {
	               alert('Sharing is not supported on this browser');
	           }
	       }

	       async function fetchNews(query = "", totalArticles = 30) {
	           const container = document.getElementById("news-container");
	           container.innerHTML = '<div class="loading">Loading news...<\/div>';

	           let articles = [];
	           let remaining = totalArticles;
	           let page = 1;

	           const seenTitles = new Set();

	           while (remaining > 0) {
	               const maxPerRequest = Math.min(10, remaining);
	               const url = query
	                   ? `${baseUrl}/search?q=${encodeURIComponent(query)}&lang=en&country=in&max=${maxPerRequest}&page=${page}&apikey=${apiKey}`
	                   : `${baseUrl}/top-headlines?lang=en&country=in&max=${maxPerRequest}&page=${page}&apikey=${apiKey}`;

	               try {
	                   const res = await fetch(url);
	                   const data = await res.json();
	                   if (data.articles && data.articles.length > 0) {
	                       data.articles.forEach((article) => {
	                           if (!seenTitles.has(article.title)) {
	                               seenTitles.add(article.title);
	                               articles.push(article);
	                           }
	                       });
	                   } else {
	                       break;
	                   }
	               } catch (err) {
	                   console.error("Error loading news:", err);
	                   container.innerHTML = "<p>Error loading news. Try again later.<\/p>";
	                   return;
	               }

	               remaining -= maxPerRequest;
	               page++;
	           }

	           if (articles.length === 0) {
	               container.innerHTML = "<p>No news found.<\/p>";
	               return;
	           }

	           container.innerHTML = "";
	           articles.forEach(article => {
	               const card = document.createElement("div");
	               card.className = "news-card";
	               const imageUrl = article.image || "https://via.placeholder.com/400x200?text=No+Image";

	               card.innerHTML = `
	                   <img src="${imageUrl}" class="news-image" alt="News Image" loading="lazy" />
	                   <div class="news-content">
	                       <h3>${article.title}<\/h3>
	                       <p>${article.description || "No description available."}<\/p>
	                       <div class="action-buttons">
	                           <a href="${article.url}" target="_blank" class="read-more">Read More →<\/a>
	                           <button onclick='shareArticle(${JSON.stringify(article)})' class="share-btn">
	                               <svg width="20" height="20" viewBox="0 0 24 24">
	                                   <path fill="currentColor" d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/>
	                               <\/svg>
	                           <\/button>
	                           <button onclick='saveArticleOffline(${JSON.stringify(article)})' class="save-btn">
	                               <svg width="20" height="20" viewBox="0 0 24 24">
	                                   <path fill="currentColor" d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
	                               <\/svg>
	                           <\/button>
	                       <\/div>
	                       <div class="news-footer">
	                           ${article.source.name} • ${new Date(article.publishedAt).toLocaleDateString()}
	                       <\/div>
	                   <\/div>
	               `;
	               container.appendChild(card);
	           });
	       }

	       // Event Listeners
	       document.getElementById("search-button").addEventListener("click", () => {
	           const query = document.getElementById("search-input").value;
	           fetchNews(query);
	       });

	       document.getElementById("search-input").addEventListener("keypress", (e) => {
	           if (e.key === "Enter") {
	               const query = e.target.value;
	               fetchNews(query);
	           }
	       });

	       document.querySelectorAll(".trend-link").forEach(link => {
	           link.addEventListener("click", () => {
	               const topic = link.getAttribute("data-topic");
	               document.getElementById("search-input").value = topic;
	               fetchNews(topic);
	           });
	       });

	       // Initial load
	       fetchNews();
	</script>
</body>
</html>
